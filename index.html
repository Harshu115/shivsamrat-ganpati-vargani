<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#e85d04"><title>ShivSamarat Ganpati Vargani</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#fff8f1;color:#2b211c}.wrap{max-width:900px;margin:auto}header{background:linear-gradient(135deg,#e85d04,#f48c06);color:white;padding:22px 16px;border-radius:0 0 25px 25px}header h1{margin:0;font-size:24px}main{padding:12px}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;padding:12px;position:sticky;top:0;background:#fff8f1;z-index:3}button{font:inherit;cursor:pointer}.tab{border:0;background:white;border-radius:10px;padding:11px 4px;font-weight:800;color:#756b65}.tab.active,.btn{background:#e85d04;color:white}.page{display:none}.page.active{display:block}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.card,form,.row,.box{background:white;border:1px solid #eaded4;border-radius:15px;padding:14px}.label,small{color:#756b65;font-size:12px}.value{font-size:20px;font-weight:850;margin-top:4px}.green{color:#16803c}.red{color:#c62828}h2{font-size:18px;margin:20px 3px 10px}form{display:grid;gap:5px}label{font-size:13px;font-weight:700;margin-top:6px}input,select{width:100%;padding:12px;border:1px solid #d9ccc3;border-radius:10px;font-size:16px}.btn{border:0;border-radius:10px;padding:13px;font-weight:800;margin-top:10px}.list{display:grid;gap:8px}.row{display:flex;justify-content:space-between;gap:10px}.row small{display:block;margin-top:3px}.del{border:0;background:#fff0ed;color:#c62828;border-radius:8px;padding:7px 9px}.export{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.export button{border:0;border-radius:10px;padding:11px;color:white;font-weight:800;background:#e85d04}.export button:last-child{background:#16803c}.notice{padding:10px;border-radius:9px;background:#fff0dc;margin:10px 0;font-size:13px}.error{background:#ffe5e5;color:#a00}.hidden{display:none!important}.auth{max-width:430px;margin:45px auto;padding:18px}.auth h1{text-align:center}.switch{border:0;background:none;color:#e85d04;font-weight:800;width:100%;margin-top:12px}@media(max-width:600px){.cards{grid-template-columns:1fr 1fr}.cards .card:last-child{grid-column:span 2}.tab{font-size:12px}}
</style></head><body>
<div id="auth" class="auth box"><h1>🪔 ShivSamarat</h1><p style="text-align:center">Ganpati Vargani Management</p><div id="am" class="notice hidden"></div><form id="af"><label>Email</label><input id="email" type="email" required><label>Password</label><input id="password" type="password" minlength="6" required><div id="nl" class="hidden"><label>Name</label><input id="name"></div><button class="btn" id="ab">Login</button></form><button class="switch" id="sw">New user? Create account</button></div>
<div id="app" class="wrap hidden"><header><h1>🪔 ShivSamarat Ganpati Vargani</h1><div>Live shared data</div></header><div style="padding:8px 12px;display:flex;justify-content:space-between"><small id="who"></small><button id="logout">Logout</button></div>
<div class="tabs"><button class="tab active" data-p="dash">Dashboard</button><button class="tab" data-p="var">Vargani</button><button class="tab" data-p="exp">Expense</button><button class="tab" data-p="pen">Pending</button></div><main>
<section id="dash" class="page active"><div id="msg" class="notice hidden"></div><div class="cards"><div class="card"><div class="label">Collected</div><div class="value green" id="tv">₹0</div></div><div class="card"><div class="label">Expense</div><div class="value red" id="te">₹0</div></div><div class="card"><div class="label">Balance</div><div class="value" id="bal">₹0</div></div></div><div class="box" style="margin-top:9px"><div class="label">Pending</div><div class="value" id="tp">₹0</div></div><div class="export"><button id="csv">⬇ CSV</button><button id="xls">📊 Excel</button></div><h2>Recent Vargani</h2><div id="rv" class="list"></div><h2>Recent Expenses</h2><div id="re" class="list"></div></section>
<section id="var" class="page"><h2>Add Vargani</h2><form id="vf"><label>Name</label><input id="vn" required><label>Mobile</label><input id="vm" inputmode="tel"><label>Amount</label><input id="va" type="number" min="1" required><label>Date</label><input id="vd" type="date" required><button class="btn">Save Vargani</button></form><h2>All Vargani</h2><div id="vl" class="list"></div></section>
<section id="exp" class="page"><h2>Add Expense</h2><form id="ef"><label>Description</label><input id="ed" required><label>Category</label><select id="ec"><option>Decoration</option><option>Prasad</option><option>Sound System</option><option>Mandap</option><option>Electricity</option><option>Other</option></select><label>Amount</label><input id="ea" type="number" min="1" required><label>Date</label><input id="et" type="date" required><button class="btn">Save Expense</button></form><h2>All Expenses</h2><div id="el" class="list"></div></section>
<section id="pen" class="page"><h2>Add Pending</h2><form id="pf"><label>Name</label><input id="pn" required><label>Mobile</label><input id="pm" inputmode="tel"><label>Amount</label><input id="pa" type="number" min="1" required><label>Expected Date</label><input id="pd" type="date"><button class="btn">Save Pending</button></form><h2>Pending Collection</h2><div id="pl" class="list"></div></section>
</main></div>
<script type="module">
import {createClient} from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";
const sb=createClient("https://ufrsbskwjzlsvvxuciox.supabase.co","sb_publishable_oDZnVdHGu8rgUXmnsnJFQw_-uvWpdSX"),$=x=>document.getElementById(x),today=()=>new Date().toISOString().slice(0,10),money=n=>"₹"+Number(n||0).toLocaleString("en-IN");let D={v:[],e:[],p:[]},signup=false;
function note(t,err=false){$("msg").textContent=t;$("msg").className="notice "+(err?"error":"");$("msg").classList.remove("hidden");setTimeout(()=>$("msg").classList.add("hidden"),3000)}
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]) )}
async function load(){let [v,e,p]=await Promise.all([sb.from("vargani").select("*").order("created_at",{ascending:false}),sb.from("expenses").select("*").order("created_at",{ascending:false}),sb.from("pending_vargani").select("*").order("created_at",{ascending:false})]);if(v.error||e.error||p.error)return note((v.error||e.error||p.error).message,true);D={v:v.data||[],e:e.data||[],p:p.data||[]};render()}
function item(title,sub,type,id){return `<div class="row"><div><b>${esc(title)}</b><small>${esc(sub)}</small></div><button class="del" onclick="delRow('${type}','${id}')">Delete</button></div>`}
function render(){let tv=D.v.reduce((a,x)=>a+Number(x.amount),0),te=D.e.reduce((a,x)=>a+Number(x.amount),0),tp=D.p.filter(x=>x.status!=="paid").reduce((a,x)=>a+Number(x.amount),0);$("tv").textContent=money(tv);$("te").textContent=money(te);$("bal").textContent=money(tv-te);$("tp").textContent=money(tp);$("rv").innerHTML=D.v.slice(0,5).map(x=>item(x.person_name,money(x.amount)+" • "+x.collected_on,"vargani",x.id)).join("")||"No entries";$("re").innerHTML=D.e.slice(0,5).map(x=>item(x.description,money(x.amount)+" • "+x.category,"expenses",x.id)).join("")||"No entries";$("vl").innerHTML=D.v.map(x=>item(x.person_name,money(x.amount)+" • "+x.collected_on+" • "+(x.mobile||"No mobile"),"vargani",x.id)).join("")||"No records";$("el").innerHTML=D.e.map(x=>item(x.description,money(x.amount)+" • "+x.category+" • "+x.spent_on,"expenses",x.id)).join("")||"No records";$("pl").innerHTML=D.p.map(x=>item(x.person_name,money(x.amount)+" • "+(x.expected_on||"No date"),"pending_vargani",x.id)).join("")||"No pending records"}
window.delRow=async(t,id)=>{if(!confirm("Delete this record?"))return;let r=await sb.from(t).delete().eq("id",id);if(r.error)note(r.error.message,true);else note("Deleted")};
async function uid(){let r=await sb.auth.getUser();return r.data.user?.id}
$("vf").onsubmit=async e=>{e.preventDefault();let id=await uid(),r=await sb.from("vargani").insert({person_name:$("vn").value.trim(),mobile:$("vm").value.trim(),amount:+$("va").value,collected_on:$("vd").value,added_by:id});if(r.error)note(r.error.message,true);else{e.target.reset();$("vd").value=today();note("Vargani saved")}};
$("ef").onsubmit=async e=>{e.preventDefault();let id=await uid(),r=await sb.from("expenses").insert({description:$("ed").value.trim(),category:$("ec").value,amount:+$("ea").value,spent_on:$("et").value,added_by:id});if(r.error)note(r.error.message,true);else{e.target.reset();$("et").value=today();note("Expense saved")}};
$("pf").onsubmit=async e=>{e.preventDefault();let id=await uid(),r=await sb.from("pending_vargani").insert({person_name:$("pn").value.trim(),mobile:$("pm").value.trim(),amount:+$("pa").value,expected_on:$("pd").value||null,added_by:id});if(r.error)note(r.error.message,true);else{e.target.reset();note("Pending saved")}};
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));$(b.dataset.p).classList.add("active");document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));b.classList.add("active")});
async function start(s){$("auth").classList.add("hidden");$("app").classList.remove("hidden");$("who").textContent=s.user.email;document.querySelectorAll('input[type="date"]').forEach(x=>x.value=today());await load();sb.removeAllChannels();sb.channel("live").on("postgres_changes",{event:"*",schema:"public",table:"vargani"},load).on("postgres_changes",{event:"*",schema:"public",table:"expenses"},load).on("postgres_changes",{event:"*",schema:"public",table:"pending_vargani"},load).subscribe()}
$("logout").onclick=()=>sb.auth.signOut();$("sw").onclick=()=>{signup=!signup;$("ab").textContent=signup?"Create Account":"Login";$("nl").classList.toggle("hidden",!signup);$("sw").textContent=signup?"Already have an account? Login":"New user? Create account"};
$("af").onsubmit=async e=>{e.preventDefault();$("am").classList.add("hidden");let email=$("email").value.trim(),password=$("password").value;if(signup){let r=await sb.auth.signUp({email,password,options:{data:{full_name:$("name").value.trim()}}});if(r.error){$("am").textContent=r.error.message;$("am").className="notice error";return}if(r.data.session)start(r.data.session);else{$("am").textContent="Account created. Confirm your email if required, then login.";$("am").className="notice"}}else{let r=await sb.auth.signInWithPassword({email,password});if(r.error){$("am").textContent=r.error.message;$("am").className="notice error";return}start(r.data.session)}};
sb.auth.onAuthStateChange((ev,s)=>{if(ev==="SIGNED_OUT"){location.reload()}});
function download(c,n,t){let u=URL.createObjectURL(new Blob([c],{type:t})),a=document.createElement("a");a.href=u;a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function rows(){return [["Type","Name/Description","Mobile","Category","Amount","Date","Status"],...D.v.map(x=>["Vargani",x.person_name,x.mobile,"",x.amount,x.collected_on,"Received"]),...D.e.map(x=>["Expense",x.description,"",x.category,x.amount,x.spent_on,""]),...D.p.map(x=>["Pending Vargani",x.person_name,x.mobile,"",x.amount,x.expected_on||"",x.status]) ]}
$("csv").onclick=()=>download("\ufeff"+rows().map(r=>r.map(v=>'"'+String(v??"").replace(/"/g,'""')+'"').join(",")).join("\r\n"),"ShivSamarat_Ganpati_Vargani.csv","text/csv");
$("xls").onclick=()=>{let r=rows(),t="<table border=1>"+r.map((x,i)=>"<tr>"+x.map(v=>(i?"<td>":"<th>")+esc(v)+(i?"</td>":"</th>")).join("")+"</tr>").join("")+"</table>";download("\ufeff<html><meta charset=utf-8><body><h2>ShivSamarat Ganpati Vargani</h2>"+t+"</body></html>","ShivSamarat_Ganpati_Vargani.xls","application/vnd.ms-excel")};
let s=(await sb.auth.getSession()).data.session;if(s)start(s);
</script></body></html>
